name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev build-essential

      # rustup reads rust-toolchain.toml and installs the pinned channel and components.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: extractions/setup-just@v4

      - run: just ci

  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Standard needs bubblewrap and unprivileged user namespaces, which Ubuntu's AppArmor
      # restricts by default. Light needs Landlock ABI 6 (Linux 6.12+); the kernel is printed
      # so a failure there is easy to read.
      - name: Prepare Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          uname -r
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v4

      # TEMPORARY diagnostics for the Seatbelt profile; remove before merging.
      - name: Seatbelt startup diagnostics
        if: runner.os == 'macOS'
        run: |
          cargo build --quiet -p forge-sandbox --bin forge-sandbox-probe
          P="$PWD/target/debug/forge-sandbox-probe"
          base='(version 1)(allow process-exec process-fork)(allow file-map-executable)(allow sysctl-read)(allow mach-lookup)(allow file-read-metadata file-test-existence)'
          echo "== all reads allowed"
          sandbox-exec -p "(version 1)(deny default)$base(allow file-read*)" "$P" read /etc/hosts; echo "exit $?"
          echo "== reads reported"
          sandbox-exec -p "(version 1)(deny default (with report))$base(allow file-read* (with report))" "$P" read /etc/hosts; echo "exit $?"
          echo "== only /usr /System /Library allowed, denials reported"
          sandbox-exec -p "(version 1)(deny default (with report))$base(allow file-read* (subpath \"/usr\") (subpath \"/System\") (subpath \"/Library\") (subpath \"$P\") (literal \"/etc/hosts\") (literal \"/private/etc/hosts\"))" "$P" read /etc/hosts; echo "exit $?"
          sleep 2
          log show --last 3m --style compact --predicate 'eventMessage CONTAINS "forge-sandbox-p"' \
            | grep -E "allow|deny" | sed -E 's/^.*(allow|deny)/\1/' | sort | uniq -c | sort -rn | head -150

      - run: just test-sandbox

      # Seatbelt reports what it denied only to the unified log.
      - name: Show Seatbelt denials
        if: failure() && runner.os == 'macOS'
        run: |
          log show --last 15m --style compact \
            --predicate 'eventMessage CONTAINS "forge-sandbox" OR eventMessage CONTAINS "sandbox-exec" OR eventMessage CONTAINS "forge-fake-agen"' \
            | tail -300
          # The crash report's termination reason says why dyld or the kernel killed it.
          for report in ~/Library/Logs/DiagnosticReports/forge-*.ips; do
            [ -e "$report" ] || continue
            echo "== $report"
            head -c 6000 "$report"
            echo
          done

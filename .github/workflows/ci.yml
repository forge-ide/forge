name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The packages are about 64 MB, and the runners' Ubuntu mirror can take half an hour to
      # send them, so the downloaded .debs are cached. The key changes with the runner image,
      # whose package versions move with it; apt fetches only what the cache lacks.
      - name: Name the apt cache
        if: runner.os == 'Linux'
        id: apt
        run: echo "key=apt-$ImageOS-$ImageVersion-${{ hashFiles('.github/workflows/ci.yml') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        if: runner.os == 'Linux'
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.key }}
          restore-keys: apt-

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
            libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev libxdo-dev build-essential
          sudo rm -f ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      # rustup reads rust-toolchain.toml and installs the pinned channel and components.
      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Reads the pnpm version from packageManager in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: extractions/setup-just@v4

      - run: just ci

  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Standard needs bubblewrap and unprivileged user namespaces, which Ubuntu's AppArmor
      # restricts by default. Light needs Landlock ABI 6 (Linux 6.12+); the kernel is printed
      # so a failure there is easy to read.
      - name: Prepare Linux sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          uname -r
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v4

      - run: just test-sandbox

      # Seatbelt reports what it denied only to the unified log.
      - name: Show Seatbelt denials
        if: failure() && runner.os == 'macOS'
        run: |
          log show --last 15m --style compact \
            --predicate 'eventMessage CONTAINS "forge-sandbox" OR eventMessage CONTAINS "sandbox-exec" OR eventMessage CONTAINS "forge-fake-agen"' \
            | tail -300
          # The crash report's termination reason says why dyld or the kernel killed it.
          for report in ~/Library/Logs/DiagnosticReports/forge-*.ips; do
            [ -e "$report" ] || continue
            echo "== $report"
            head -c 6000 "$report"
            echo
          done

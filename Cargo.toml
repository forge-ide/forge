[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/forge-ide/forge"
publish = false

[workspace.dependencies]
forge-acp = { path = "crates/forge-acp" }
forge-api = { path = "crates/forge-api" }
forge-config = { path = "crates/forge-config" }
forge-events = { path = "crates/forge-events" }
forge-fake-agent = { path = "crates/forge-fake-agent" }
forge-git = { path = "crates/forge-git" }
forge-policy = { path = "crates/forge-policy" }
forge-sandbox = { path = "crates/forge-sandbox" }
forge-session = { path = "crates/forge-session" }

agent-client-protocol = { version = "3.5.0", default-features = false }
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
globset = "0.4.20"
httparse = "1.10.1"
insta = "1.49.0"
landlock = "0.4.7"
libc = "0.2.191"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls-native-certs = "0.8.5"
rustix = { version = "1.1.5", features = ["fs", "process"] }
schemars = "1.2.3"
seccompiler = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
similar = "3.2.0"
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30.0"
tokio-util = { version = "0.7.20", features = ["compat"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "serde-json-impl"] }
ulid = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

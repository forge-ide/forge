# Gemini CLI, which speaks ACP itself.
id = "gemini"
name = "Gemini CLI"
profile = "gemini"

[package]
npm = "@google/gemini-cli"
version = "0.65.0"
bin = "gemini"
runtime = "node"

[launch]
args = ["--acp", "--approval-mode", "default"]
env = { GEMINI_CLI_TRUST_WORKSPACE = "true" }

[auth]
secrets = ["GEMINI_API_KEY"]

[permissions]
# Shell requests carry no rawInput; the title is the command line.
command = "title"

[quirks]
notes = [
    "Shell permission requests carry no rawInput, only the command line as their title.",
    "Runs shell commands and reads files itself; writes and edits go through ACP's file methods.",
    "Auto-allows a list of read-only shell commands unless a policy rule with an args pattern asks; the shim's policy asks for every shell command.",
    "Starts no MCP server in an untrusted folder, Forge's included, so the shim trusts the worktree. Its policy, passed with --policy (which replaces ~/.gemini/policies), ranks above the workspace's. It gets no settings: Gemini skips a system settings file outside a root-owned directory, and user settings rank below the workspace's. So a launch is refused while the worktree has .gemini/settings.json or .gemini/.env, whose hooks, tool discovery, and MCP servers would run unasked; settings are read only at startup.",
    "Loads a .env from the worktree and its parents without replacing variables already set, so the shim sets the variables that redirect it (settings, system prompt, credentials, NODE_OPTIONS) empty.",
    "A repo's .gemini/commands run shell only when a human invokes them; GEMINI.md, agents, skills, and policies run nothing unasked.",
    "An invalid policy file is reported on stderr and skipped, not fatal; Forge's is a fixed constant.",
    "Google sign-in keeps credentials in the real home, which the sandbox hides; Forge uses an API key from the keyring.",
]

# Codex through the Codex ACP adapter, which drives `codex app-server`.
id = "codex"
name = "Codex"
profile = "codex"

[package]
npm = "@agentclientprotocol/codex-acp"
version = "2.2.2"
bin = "codex-acp"
runtime = "node"

[launch]
args = []
# Sign in with OPENAI_API_KEY, which in the sandbox is the proxy's placeholder, so the
# auth.json Codex writes in its scratch home holds no secret. The shim switches this to
# ChatGPT for a ChatGPT sign-in.
env = { INITIAL_AGENT_MODE = "read-only", NO_BROWSER = "1", DEFAULT_AUTH_REQUEST = '{"methodId":"api-key"}' }

[auth]
secrets = ["OPENAI_API_KEY"]
# Without them, the sign-in the agent\'s own CLI keeps in the real home, sent by the proxy.
login = "chatgpt"

[permissions]
# Approval requests strip the shell prefix from the command; the tool call that precedes
# them carries Codex's whole argv, shell-quoted.
command = "tool-call-argv"

[quirks]
notes = [
    "No adapter mode sends every command to the client, and Codex's own sandbox (bubblewrap, or Landlock with bubblewrap) can't start inside any Forge tier. Forge runs it in `read-only`, where patches always ask; a command fails before it starts unless Codex escalates it, and an escalated command reaches Forge's gate with its whole argv. The shim tells Codex to escalate every command; a command it doesn't escalate never runs.",
    "Codex wraps commands in the user's login shell (`bash -lc`); the shim turns login shells and the shell snapshot off, so commands arrive as `<shell> -c <script>`. A user whose passwd shell is zsh or fish gets an ask for every command.",
    "Runs commands and applies patches itself, never through ACP's file or terminal methods.",
    "codex-acp trusts every project, so Codex reads a repo's .codex/config.toml and hooks (from the worktree, at startup; a launch is refused while they differ from the branch's last commit, so a command can't add to them for the next launch) as well as a copy of the user's ~/.codex/config.toml; CODEX_CONFIG wins over both only for the keys it sets. AGENTS.md, prompts, rules, skills, and plugins are linked read-only from the real ~/.codex; an exec-policy rule there that allows a command may let it run without asking Forge.",
    "approvals_reviewer = auto_review would have a model approve escalations, which then never reach Forge, so the shim pins it to `user`.",
    "Its patch approvals name only the files a patch changes in place; where it moves a file, and which it deletes, come in the diffs of the tool call before it, which Forge decides too. A patch whose diffs weren't reported (too large) is refused.",
    "Offers to save an exec-policy rule with an approval; Forge never picks it. It leads with a plain approval (allow_once) whenever Codex allows one; without it, Forge would pick the session-wide approval, so the smoke checklist checks every exec approval offers allow_once.",
    "Its approval for a parsed command may carry Codex's parsed form; Forge decides the argv from the tool call's first report instead, and ignores the request's cwd (commands run in the worktree).",
    "At start it reaches github.com and chatgpt.com, which the egress proxy refuses; it works without them.",
    "Tries the Responses API over WebSocket first and falls back to HTTPS by itself.",
    "With OPENAI_API_KEY in the keyring, it signs in with the proxy's placeholder (DEFAULT_AUTH_REQUEST). Without one, the ChatGPT sign-in from ~/.codex/auth.json: the sandbox home gets an auth.json of placeholders (unsigned tokens with the real ones' claims, which Codex reads its plan from, and no refresh token), a model provider of Forge's points at the proxy (the built-in one routes ChatGPT workspaces only to HTTPS origins), and the proxy sends the real access token, read fresh, to chatgpt.com/backend-api/codex/responses and /models only. An expired sign-in is refreshed by running `codex login` outside Forge.",
]
